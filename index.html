<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>BidLedger</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-title" content="BidLedger" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, sans-serif;
        overflow-x: hidden;
        touch-action: manipulation;
      }
      .item-name {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 0.95rem;
        line-height: 1.2;
        font-weight: 700;
        cursor: pointer;
      }
      .high-roi {
        color: #064e3b;
        font-weight: 900;
      }
      .tab-active {
        color: #2563eb;
        border-top: 3px solid #2563eb;
      }
      .swipe-container {
        position: relative;
        overflow: hidden;
        border-radius: 0.6rem;
        margin-bottom: 0.4rem;
      }
      .swipe-actions {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        display: flex;
        width: 110px;
        z-index: 1;
        /* Hidden until the row is swiped, so the buttons don't peek
           out behind the card's rounded corners. */
        visibility: hidden;
      }
      .swipe-container.open .swipe-actions {
        visibility: visible;
      }
      .swipe-content {
        position: relative;
        z-index: 2;
        transition: transform 0.2s ease-out;
        background: white;
        width: 100%;
      }
      .swiped {
        transform: translateX(-110px);
      }
      /* Rows on the Inv tab: the browser handles up/down scrolling,
         sideways movement is left to the swipe code. */
      .swipe-container.swipeable .swipe-content {
        touch-action: pan-y;
      }
      .swipe-content.dragging {
        transition: none;
      }
      .fee-btn {
        transition: all 0.1s;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #64748b;
        font-size: 0.75rem;
        padding: 4px 8px;
        border-radius: 6px;
        font-weight: 800;
      }
      .fee-btn.active {
        background-color: #dbeafe;
        color: #1e40af;
        border-color: #93c5fd;
      }

      .calc-container {
        height: calc(100dvh - 190px);
      }
      .calc-mode {
        padding: 0.45rem 0;
        border-radius: 0.6rem;
        font-size: 9px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }
      .calc-mode.active {
        background: white;
        color: #0f172a;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.15);
      }
      .numpad-btn {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 0.6rem;
        font-weight: 800;
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.05s;
        min-height: 0;
      }
      .numpad-btn:active {
        background-color: #eff6ff;
        transform: scale(0.95);
      }
    </style>
  </head>
  <body class="bg-slate-50 pb-20 text-slate-900">
    <div class="max-w-md mx-auto p-3">
      <header class="flex justify-between items-center mb-3 px-1">
        <h1 class="text-lg font-black tracking-tighter text-slate-800">
          BidLedger
        </h1>
        <div class="flex gap-1.5 items-center">
          <button
            onclick="exportBackup()"
            class="bg-slate-200 text-slate-700 px-2 py-1 rounded text-[8px] font-black uppercase"
          >
            Backup
          </button>
          <label
            class="bg-slate-800 text-white px-2 py-1 rounded text-[8px] font-black uppercase cursor-pointer"
          >
            Restore
            <input
              type="file"
              id="restore-file"
              accept=".json"
              class="hidden"
              onchange="handleRestore(this)"
            />
          </label>
          <button
            onclick="toggleAddModal()"
            class="bg-blue-600 text-white w-7 h-7 flex items-center justify-center rounded-full shadow-md"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="4"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
          <label
            class="bg-blue-100 text-blue-600 w-7 h-7 flex items-center justify-center rounded-full cursor-pointer"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <input
              type="file"
              id="csv-input"
              accept=".csv"
              class="hidden"
              onchange="openImportModal(this)"
            />
          </label>
        </div>
      </header>

      <div
        id="summary-card"
        class="bg-slate-900 text-white p-4 rounded-2xl shadow-xl mb-3"
      >
        <p class="text-[8px] opacity-60 font-bold uppercase tracking-widest">
          Net Profit
        </p>
        <h2 id="total-profit" class="text-2xl font-black tracking-tighter">
          $0.00
        </h2>
        <div
          class="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-white/10"
        >
          <div>
            <p class="text-[7px] opacity-60 font-bold uppercase tracking-widest">
              Revenue
            </p>
            <p id="total-revenue" class="text-sm font-bold opacity-90">$0.00</p>
          </div>
          <div class="text-center">
            <p class="text-[7px] opacity-60 font-bold uppercase tracking-widest">
              Unsold
            </p>
            <p id="total-unsold" class="text-sm font-bold opacity-90">$0.00</p>
          </div>
          <div class="text-right">
            <p class="text-[7px] opacity-60 font-bold uppercase tracking-widest">
              Inv Cost
            </p>
            <p id="total-cost" class="text-sm font-bold opacity-90">$0.00</p>
          </div>
        </div>
      </div>

      <div id="main-view">
        <div class="relative mb-3">
          <input
            id="search-input"
            type="text"
            placeholder="Search items..."
            oninput="render()"
            class="w-full p-2.5 pl-9 bg-white border border-slate-200 rounded-xl outline-none text-xs font-medium"
          />
          <svg
            class="absolute left-3 top-3 text-slate-400"
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </div>
        <div id="tab-extra"></div>
        <div id="item-list"></div>

        <div
          id="trash-section"
          class="mt-6 pt-4 border-t border-slate-200 hidden"
        >
          <div class="flex justify-between items-center mb-3 px-1">
            <button
              onclick="toggleTrash()"
              class="text-slate-400 text-[9px] font-black uppercase flex items-center gap-1"
            >
              Trash Bin (<span id="trash-count">0</span>)
            </button>
            <button
              onclick="emptyTrash()"
              class="text-red-500 text-[9px] font-black uppercase tracking-wider"
            >
              Wipe All
            </button>
          </div>
          <div id="trash-list" class="hidden space-y-2 pb-10"></div>
        </div>
      </div>

      <div id="calc-view" class="hidden flex-col calc-container">
        <div
          class="grid grid-cols-2 gap-1 p-1 bg-slate-200/70 rounded-xl shrink-0"
        >
          <button
            id="calc-mode-cost"
            onclick="setCalcMode('cost')"
            class="calc-mode active"
          >
            Total Cost
          </button>
          <button
            id="calc-mode-max"
            onclick="setCalcMode('max')"
            class="calc-mode"
          >
            Max Bid
          </button>
        </div>
        <div class="text-center py-2 shrink-0">
          <p
            id="calc-result-label"
            class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1"
          >
            Final Total
          </p>
          <h2
            id="calc-tab-total"
            class="text-4xl font-black text-blue-600 tracking-tighter"
          >
            $0.00
          </h2>
          <p
            id="calc-result-sub"
            class="text-[8px] font-bold text-slate-400 uppercase tracking-tight mt-1 min-h-[24px] leading-relaxed"
          ></p>
        </div>
        <div class="grid grid-cols-2 gap-2 mb-3 shrink-0">
          <div
            id="calc-main-cell"
            class="bg-white border-2 border-blue-500 p-2 rounded-xl"
          >
            <label
              id="calc-main-label"
              class="text-[8px] font-bold text-blue-600 uppercase block"
              >Bid ($)</label
            ><input
              id="calc-tab-buy"
              type="text"
              readonly
              class="w-full bg-transparent font-black text-base outline-none"
            /><input
              id="calc-tab-sell"
              type="text"
              readonly
              placeholder="0"
              class="hidden w-full bg-transparent font-black text-base outline-none"
            />
          </div>
          <div
            class="bg-white border border-slate-200 p-2 rounded-xl flex flex-col justify-between"
          >
            <label class="text-[8px] font-bold text-slate-400 uppercase block"
              >Fee ($)</label
            >
            <input
              id="calc-tab-fee"
              type="number"
              value="1.50"
              oninput="runStandaloneCalc()"
              class="w-full bg-transparent font-bold text-sm outline-none mb-1"
            />
            <div class="flex gap-1">
              <button
                onclick="setCalcQuickFee(1.5, 'ENC')"
                id="calc-btn-enc"
                class="fee-btn active text-[6px] px-1 py-0.5"
              >
                ENC
              </button>
              <button
                onclick="setCalcQuickFee(1.0, 'AMZ')"
                id="calc-btn-amz"
                class="fee-btn text-[6px] px-1 py-0.5"
              >
                AMZ
              </button>
            </div>
          </div>
          <div class="bg-white border border-slate-200 p-2 rounded-xl">
            <label class="text-[8px] font-bold text-slate-400 uppercase block"
              >Prem %</label
            ><input
              id="calc-tab-prem"
              type="number"
              value="16"
              oninput="runStandaloneCalc()"
              class="w-full bg-transparent font-bold text-sm outline-none"
            />
          </div>
          <div class="bg-white border border-slate-200 p-2 rounded-xl">
            <label class="text-[8px] font-bold text-slate-400 uppercase block"
              >Tax %</label
            ><input
              id="calc-tab-tax"
              type="number"
              value="13"
              oninput="runStandaloneCalc()"
              class="w-full bg-transparent font-bold text-sm outline-none"
            />
          </div>
          <div
            id="calc-target-cell"
            class="hidden col-span-2 bg-white border border-slate-200 px-2 py-1.5 rounded-xl flex items-center gap-2"
          >
            <div class="shrink-0">
              <label class="text-[8px] font-bold text-slate-400 uppercase block"
                >Target</label
              >
              <input
                id="calc-tab-target"
                type="number"
                inputmode="decimal"
                value="50"
                oninput="runStandaloneCalc()"
                class="w-14 bg-transparent font-black text-base outline-none"
              />
            </div>
            <div id="calc-tgt-chips" class="flex gap-1"></div>
            <div class="flex gap-1 ml-auto">
              <button
                id="calc-tgt-pct"
                onclick="setTargetType('pct')"
                class="fee-btn active text-[8px] px-1.5 py-1"
              >
                %
              </button>
              <button
                id="calc-tgt-usd"
                onclick="setTargetType('usd')"
                class="fee-btn text-[8px] px-1.5 py-1"
              >
                $
              </button>
            </div>
          </div>
        </div>
        <div
          class="grid grid-cols-3 gap-2 grow mb-2 min-h-0"
          style="grid-template-rows: repeat(4, minmax(40px, 1fr)) 36px"
        >
          <button onclick="pressNum('1')" class="numpad-btn">1</button
          ><button onclick="pressNum('2')" class="numpad-btn">2</button
          ><button onclick="pressNum('3')" class="numpad-btn">3</button>
          <button onclick="pressNum('4')" class="numpad-btn">4</button
          ><button onclick="pressNum('5')" class="numpad-btn">5</button
          ><button onclick="pressNum('6')" class="numpad-btn">6</button>
          <button onclick="pressNum('7')" class="numpad-btn">7</button
          ><button onclick="pressNum('8')" class="numpad-btn">8</button
          ><button onclick="pressNum('9')" class="numpad-btn">9</button>
          <button onclick="pressNum('.')" class="numpad-btn">.</button
          ><button onclick="pressNum('0')" class="numpad-btn">0</button
          ><button onclick="pressNum('⌫')" class="numpad-btn text-red-500">
            ⌫
          </button>
          <button
            id="calc-clear-btn"
            onclick="pressNum('C')"
            class="col-span-3 numpad-btn text-slate-400 uppercase"
            style="font-size: 11px; min-height: 0"
          >
            Clear Bid
          </button>
        </div>
      </div>
    </div>

    <div
      id="edit-modal"
      class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-[160] hidden flex items-center justify-center p-6"
    >
      <div
        class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl max-h-[90dvh] overflow-y-auto"
      >
        <h3
          class="text-center font-black text-slate-400 uppercase mb-3 text-[10px] tracking-widest"
        >
          Edit Item
        </h3>
        <textarea
          id="ed-name"
          rows="2"
          placeholder="Item Name"
          class="w-full mb-3 p-3 bg-slate-100 rounded-lg text-sm font-bold outline-none resize-none"
        ></textarea>
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div class="bg-slate-100 p-2 rounded-lg">
            <label class="text-[8px] font-bold text-slate-400 uppercase"
              >Bid ($)</label
            ><input
              id="ed-bid"
              type="number"
              inputmode="decimal"
              oninput="editCostChanged()"
              class="w-full bg-transparent font-black text-lg outline-none"
            />
          </div>
          <div class="bg-slate-100 p-2 rounded-lg">
            <label class="text-[8px] font-bold text-slate-400 uppercase"
              >Fee ($)</label
            ><input
              id="ed-fee"
              type="number"
              inputmode="decimal"
              oninput="editCostChanged()"
              class="w-full bg-transparent font-bold text-lg outline-none"
            />
          </div>
          <div class="flex items-center gap-2">
            <button
              onclick="setEditSrc('ENC')"
              id="ed-btn-enc"
              class="fee-btn flex-1"
            >
              ENC</button
            ><button
              onclick="setEditSrc('AMZ')"
              id="ed-btn-amz"
              class="fee-btn flex-1"
            >
              AMZ
            </button>
          </div>
          <div class="bg-slate-100 p-2 rounded-lg">
            <label class="text-[8px] font-bold text-slate-400 uppercase"
              >Bought</label
            ><input
              id="ed-date"
              type="date"
              class="w-full bg-transparent font-bold text-xs outline-none"
            />
          </div>
        </div>

        <div id="ed-sold-box" class="hidden grid grid-cols-2 gap-3 mb-3">
          <div class="bg-blue-50 p-2 rounded-lg">
            <label class="text-[8px] font-bold text-blue-600 uppercase"
              >Sold for ($)</label
            ><input
              id="ed-sell"
              type="number"
              inputmode="decimal"
              oninput="editSummary()"
              class="w-full bg-transparent font-black text-lg outline-none"
            />
          </div>
          <div class="bg-blue-50 p-2 rounded-lg">
            <label class="text-[8px] font-bold text-blue-600 uppercase"
              >Sold on</label
            ><input
              id="ed-sold-date"
              type="date"
              class="w-full bg-transparent font-bold text-xs outline-none"
            />
          </div>
        </div>

        <p
          id="ed-summary"
          class="text-center text-[9px] font-black uppercase tracking-tight text-slate-400 mb-4"
        ></p>

        <div class="flex gap-3">
          <button
            onclick="closeEdit()"
            class="flex-1 py-3 text-slate-400 font-bold uppercase text-[10px]"
          >
            Cancel</button
          ><button
            onclick="saveEdit()"
            class="flex-1 bg-blue-600 text-white font-black py-3 rounded-xl uppercase text-[10px]"
          >
            Save
          </button>
        </div>
      </div>
    </div>

    <div
      id="add-modal"
      class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-[150] hidden flex items-center justify-center p-6"
    >
      <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl">
        <input
          id="in-name"
          type="text"
          placeholder="Item Name"
          class="w-full mb-3 p-3 bg-slate-100 rounded-lg text-sm font-bold outline-none"
        />
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="col-span-2 bg-slate-100 p-2 rounded-lg">
            <label class="text-[8px] font-bold text-slate-400 uppercase"
              >Bid Price ($)</label
            ><input
              id="in-buy"
              type="number"
              class="w-full bg-transparent font-black text-lg outline-none"
            />
          </div>
          <div class="bg-slate-100 p-2 rounded-lg">
            <label class="text-[8px] font-bold text-slate-400 uppercase"
              >Fee ($)</label
            ><input
              id="in-fee"
              type="number"
              value="1.50"
              class="w-full bg-transparent font-bold text-sm outline-none"
            />
          </div>
          <div class="flex items-center justify-around">
            <button
              onclick="setQuickFee(1.5, 'ENC')"
              id="btn-enc"
              class="fee-btn active"
            >
              ENC</button
            ><button
              onclick="setQuickFee(1.0, 'AMZ')"
              id="btn-amz"
              class="fee-btn"
            >
              AMZ
            </button>
          </div>
          <div class="col-span-2 bg-slate-100 p-2 rounded-lg">
            <label class="text-[8px] font-bold text-slate-400 uppercase"
              >Date</label
            ><input
              id="in-date"
              type="date"
              class="w-full bg-transparent font-bold text-xs outline-none"
            />
          </div>
        </div>
        <div class="flex gap-3">
          <button
            onclick="toggleAddModal()"
            class="flex-1 py-3 text-slate-400 font-bold uppercase text-[10px]"
          >
            Cancel</button
          ><button
            onclick="addItem()"
            class="flex-1 bg-blue-600 text-white font-black py-3 rounded-xl uppercase text-[10px]"
          >
            Save Item
          </button>
        </div>
      </div>
    </div>

    <div
      id="sale-modal"
      class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-[100] hidden flex items-center justify-center p-6"
    >
      <div class="bg-white w-full max-w-xs rounded-2xl p-6 shadow-2xl">
        <h3
          class="text-center font-black text-slate-400 uppercase mb-5 text-[10px] tracking-widest"
        >
          Sale Price
        </h3>
        <input
          id="sale-price"
          type="number"
          inputmode="decimal"
          oninput="updateLiveProfit()"
          class="w-full text-center text-4xl font-black p-3 bg-slate-100 rounded-xl outline-none mb-3"
        />

        <div
          id="live-profit-box"
          class="text-center mb-4 font-black uppercase text-[10px] tracking-tight hidden"
        >
          <span class="text-slate-400">Est. Profit: </span>
          <span id="live-profit-val" class="text-xs font-black">$-.--</span>
        </div>

        <label
          class="flex items-center justify-between gap-3 mb-4 px-1 text-[9px] font-black uppercase tracking-widest text-slate-400"
        >
          Sold on
          <input
            id="sale-date"
            type="date"
            class="flex-1 text-right text-xs font-bold text-slate-700 bg-slate-100 rounded-lg px-2 py-2 outline-none"
          />
        </label>

        <button
          id="unsold-opt"
          onclick="markUnsold()"
          class="hidden w-full py-2 mb-5 bg-slate-100 text-slate-400 font-bold rounded-lg uppercase text-[8px]"
        >
          Reset to Unsold
        </button>
        <div class="flex gap-3">
          <button
            onclick="closeSale()"
            class="flex-1 py-3 text-slate-400 font-bold uppercase text-[10px]"
          >
            Cancel</button
          ><button
            onclick="confirmSale()"
            class="flex-1 py-3 bg-blue-600 text-white font-black rounded-xl uppercase text-[10px]"
          >
            Confirm
          </button>
        </div>
      </div>
    </div>

    <div
      id="import-modal"
      class="fixed inset-0 bg-slate-900/80 backdrop-blur-lg z-[200] hidden flex items-center justify-center p-6"
    >
      <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl">
        <p
          id="import-filename"
          class="text-[10px] font-black text-blue-600 truncate mb-4 bg-blue-50 p-2 rounded-lg text-center"
        ></p>
        <div class="flex gap-2 mb-4">
          <button
            onclick="setImpSrc('ENC')"
            id="imp-enc"
            class="flex-1 py-3 rounded-lg font-black text-[10px] fee-btn active"
          >
            ENC ($1.50)
          </button>
          <button
            onclick="setImpSrc('AMZ')"
            id="imp-amz"
            class="flex-1 py-3 rounded-lg font-black text-[10px] fee-btn"
          >
            AMZ ($1.00)
          </button>
        </div>
        <input
          id="imp-date"
          type="date"
          class="w-full p-3 bg-slate-100 rounded-lg font-bold text-xs mb-5 outline-none"
        />
        <div class="flex gap-3">
          <button
            onclick="closeImport()"
            class="flex-1 py-3 text-slate-400 font-bold text-[10px]"
          >
            Cancel</button
          ><button
            onclick="confirmImport()"
            class="flex-1 py-3 bg-blue-600 text-white font-black rounded-xl text-[10px]"
          >
            Import All
          </button>
        </div>
      </div>
    </div>

    <nav
      class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around items-center py-3 px-2 pb-6 z-[50]"
    >
      <button
        onclick="switchTab('inventory')"
        id="tab-inventory"
        class="flex flex-col items-center gap-1 text-slate-300 tab-active"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path
            d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"
          /></svg
        ><span class="text-[8px] font-black uppercase">Inv</span>
      </button>
      <button
        onclick="switchTab('sold')"
        id="tab-sold"
        class="flex flex-col items-center gap-1 text-slate-300"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
          <polyline points="22 4 12 14.01 9 11.01" /></svg
        ><span class="text-[8px] font-black uppercase">Sold</span>
      </button>
      <button
        onclick="switchTab('calculator')"
        id="tab-calculator"
        class="flex flex-col items-center gap-1 text-slate-300"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <rect x="4" y="2" width="16" height="20" rx="2" />
          <line x1="8" y1="6" x2="16" y2="6" />
          <line x1="8" y1="10" x2="16" y2="10" />
          <line x1="8" y1="14" x2="16" y2="14" /></svg
        ><span class="text-[8px] font-black uppercase">Calc</span>
      </button>
      <button
        onclick="switchTab('archive')"
        id="tab-archive"
        class="flex flex-col items-center gap-1 text-slate-300"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <polyline points="21 8 21 21 3 21 3 8" />
          <rect x="1" y="3" width="22" height="5" /></svg
        ><span class="text-[8px] font-black uppercase">Arch</span>
      </button>
    </nav>

    <script>
      let db = JSON.parse(localStorage.getItem("sep_db")) || [];
      let trash = JSON.parse(localStorage.getItem("sep_trash")) || [];
      let curTab = "inventory";
      let actId = null;
      let csvFile = null;
      let impSrc = "ENC";
      let calcSrc = "ENC";
      let staleOnly = false; // Inv tab: show only items unsold 30+ days

      const STALE_DAYS = 30; // amber badge
      const OLD_DAYS = 60; // red badge

      // Today's date in the device's local time zone (YYYY-MM-DD).
      // toISOString() uses UTC, which gave tomorrow's date in the evening.
      function localToday() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }

      // Whole days between two YYYY-MM-DD dates (b - a)
      function daysBetween(a, b) {
        const ms = Date.parse(b) - Date.parse(a);
        return isNaN(ms) ? null : Math.round(ms / 86400000);
      }
      function fmtMonth(ym) {
        const [y, m] = ym.split("-").map(Number);
        return new Date(y, m - 1, 1).toLocaleDateString(undefined, {
          month: "short",
          year: "numeric",
        });
      }
      function fmtDay(d) {
        const [y, m, dd] = d.split("-").map(Number);
        return new Date(y, m - 1, dd).toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
        });
      }
      function toggleStale() {
        staleOnly = !staleOnly;
        render();
      }

      document.getElementById("in-date").value = localToday();
      document.getElementById("imp-date").value = localToday();

      function save() {
        localStorage.setItem("sep_db", JSON.stringify(db));
        localStorage.setItem("sep_trash", JSON.stringify(trash));
        render();
      }

      function switchTab(t) {
        curTab = t;
        ["inventory", "sold", "archive", "calculator"].forEach((tab) => {
          document
            .getElementById(`tab-${tab}`)
            .classList.toggle("tab-active", t === tab);
        });
        const main = document.getElementById("main-view");
        const calc = document.getElementById("calc-view");
        document
          .getElementById("summary-card")
          .classList.toggle("hidden", t === "calculator");
        if (t === "calculator") {
          main.classList.add("hidden");
          calc.classList.remove("hidden");
          calc.classList.add("flex");
          fitCalc();
        } else {
          main.classList.remove("hidden");
          calc.classList.add("hidden");
          calc.classList.remove("flex");
        }
        document
          .getElementById("trash-section")
          .classList.toggle("hidden", t !== "archive");
        render();
      }

      // ---- Calc tab: Total Cost / Max Bid ----
      let calcMode = "cost";
      let targetType = "pct"; // "pct" = ROI %, "usd" = $ profit
      const TARGET_CHIPS = { pct: [30, 50, 100], usd: [10, 20, 50] };
      try {
        const saved = JSON.parse(localStorage.getItem("bl_calc") || "{}");
        if (saved.targetType) targetType = saved.targetType;
        if (saved.target != null)
          document.getElementById("calc-tab-target").value = saved.target;
      } catch (_) {}

      // Make the calculator fill the space between its top and the tab bar
      function fitCalc() {
        const calc = document.getElementById("calc-view");
        if (calc.classList.contains("hidden")) return;
        const navTop = document.querySelector("nav").getBoundingClientRect().top;
        const top = calc.getBoundingClientRect().top + window.scrollY;
        calc.style.height = Math.max(420, navTop - top - 8) + "px";
        // On very small screens keep keys tappable and let the page scroll
        if (calc.scrollHeight > calc.clientHeight)
          calc.style.height = calc.scrollHeight + "px";
      }
      window.addEventListener("resize", fitCalc);

      function setCalcMode(m) {
        calcMode = m;
        const max = m === "max";
        document.getElementById("calc-mode-cost").classList.toggle("active", !max);
        document.getElementById("calc-mode-max").classList.toggle("active", max);
        document.getElementById("calc-tab-buy").classList.toggle("hidden", max);
        document.getElementById("calc-tab-sell").classList.toggle("hidden", !max);
        document.getElementById("calc-target-cell").classList.toggle("hidden", !max);
        document.getElementById("calc-main-label").innerText = max
          ? "Sell for ($)"
          : "Bid ($)";
        document.getElementById("calc-clear-btn").innerText = max
          ? "Clear Price"
          : "Clear Bid";
        document.getElementById("calc-result-label").innerText = max
          ? "Max Bid"
          : "Final Total";
        runStandaloneCalc();
        fitCalc();
      }

      function setTargetType(t) {
        targetType = t;
        document.getElementById("calc-tab-target").value =
          t === "pct" ? 50 : 20;
        runStandaloneCalc();
      }
      function setTarget(v) {
        document.getElementById("calc-tab-target").value = v;
        runStandaloneCalc();
      }
      function renderTargetChips() {
        const cur = parseFloat(document.getElementById("calc-tab-target").value);
        document.getElementById("calc-tgt-pct").classList.toggle("active", targetType === "pct");
        document.getElementById("calc-tgt-usd").classList.toggle("active", targetType === "usd");
        document.getElementById("calc-tgt-chips").innerHTML = TARGET_CHIPS[targetType]
          .map(
            (v) =>
              `<button onclick="setTarget(${v})" class="fee-btn text-[8px] px-2 py-1 ${
                cur === v ? "active" : ""
              }">${targetType === "pct" ? v + "%" : "$" + v}</button>`,
          )
          .join("");
      }

      function pressNum(v) {
        const i = document.getElementById(
          calcMode === "max" ? "calc-tab-sell" : "calc-tab-buy",
        );
        if (v === "C") i.value = "";
        else if (v === "⌫") i.value = i.value.slice(0, -1);
        else {
          if (v === "." && i.value.includes(".")) return;
          i.value += v;
        }
        runStandaloneCalc();
      }

      function setCalcQuickFee(v, t) {
        calcSrc = t;
        document.getElementById("calc-tab-fee").value = v.toFixed(2);
        document
          .getElementById("calc-btn-enc")
          .classList.toggle("active", t === "ENC");
        document
          .getElementById("calc-btn-amz")
          .classList.toggle("active", t === "AMZ");
        runStandaloneCalc();
      }

      function runStandaloneCalc() {
        const b =
          parseFloat(document.getElementById("calc-tab-buy").value) || 0;
        const p =
          1 +
          parseFloat(document.getElementById("calc-tab-prem").value || 16) /
            100;
        const f = parseFloat(
          document.getElementById("calc-tab-fee").value || 1.5,
        );
        const t =
          1 +
          parseFloat(document.getElementById("calc-tab-tax").value || 13) / 100;
        // AMZ: tax only on (bid + premium), fee added after tax.
        // ENC: tax on (bid + premium + fee).
        const costOf = (bid) =>
          calcSrc === "AMZ" ? bid * p * t + f : (bid * p + f) * t;
        const out = document.getElementById("calc-tab-total");
        const sub = document.getElementById("calc-result-sub");

        if (calcMode !== "max") {
          out.className = "text-4xl font-black text-blue-600 tracking-tighter";
          out.innerText = `$${costOf(b).toFixed(2)}`;
          sub.innerText = "";
          return;
        }

        // Max Bid: highest bid whose total cost still hits the target.
        renderTargetChips();
        const sell =
          parseFloat(document.getElementById("calc-tab-sell").value) || 0;
        const target =
          parseFloat(document.getElementById("calc-tab-target").value) || 0;
        try {
          localStorage.setItem("bl_calc", JSON.stringify({ targetType, target }));
        } catch (_) {}

        // Most we can spend in total and still make the target
        const maxCost =
          targetType === "pct" ? sell / (1 + target / 100) : sell - target;
        // Undo the cost formula to get the bid
        const raw =
          calcSrc === "AMZ" ? (maxCost - f) / (p * t) : (maxCost / t - f) / p;
        // Round down to the highest bid the auction will accept
        const bid = floorToValidBid(raw, calcSrc);

        if (!sell) {
          out.className = "text-4xl font-black text-slate-300 tracking-tighter";
          out.innerText = "$0.00";
          sub.innerText = "Enter what you expect to sell it for";
          return;
        }
        if (bid <= 0) {
          out.className = "text-4xl font-black text-red-600 tracking-tighter";
          out.innerText = "Pass";
          sub.innerText = "Can't hit that target at this price";
          return;
        }
        const cost = costOf(bid);
        const profit = sell - cost;
        out.className = "text-4xl font-black text-green-600 tracking-tighter";
        out.innerText = `$${bid.toFixed(2)}`;
        const roi = (profit / cost) * 100;
        // What one more bid step would give, so you know the cost of going up
        const next = nextBid(bid, calcSrc);
        const nCost = costOf(next);
        const nProfit = sell - nCost;
        sub.innerHTML = `Cost $${cost.toFixed(2)} · Profit $${profit.toFixed(
          2,
        )} · ROI ${roi.toFixed(0)}%<br><span class="text-amber-600">Next bid $${next.toFixed(
          2,
        )} → ${nProfit >= 0 ? "" : "-"}$${Math.abs(nProfit).toFixed(2)} · ${(
          (nProfit / nCost) *
          100
        ).toFixed(0)}% ROI</span>`;
      }

      // Bid increment schedules: [up to this bid, increment]. The next
      // allowed bid is the current bid plus the increment for its range.
      const BID_STEPS = {
        ENC: [
          [29, 1],
          [97.5, 2.5],
          [990, 10],
          [Infinity, 25],
        ],
        AMZ: [
          [9, 1],
          [18, 2],
          [95, 5],
          [975, 5],
          [9750, 25],
          [97500, 2500],
          [Infinity, 10000],
        ],
      };
      function nextBid(b, src) {
        const steps = BID_STEPS[src] || BID_STEPS.ENC;
        const inc = steps.find(([upTo]) => b <= upTo + 1e-9)[1];
        return Math.round((b + inc) * 100) / 100;
      }
      // Highest allowed bid that is <= amount (0 if not even the first bid)
      function floorToValidBid(amount, src) {
        let b = 0;
        while (true) {
          const n = nextBid(b, src);
          if (n > amount + 1e-9) return b;
          b = n;
        }
      }

      // ---- Full edit ----
      let edId = null,
        edSrc = "ENC",
        edCostTouched = false; // only recalc Paid if bid/fee/source change

      function costFor(bid, fee, src) {
        // AMZ: tax only on (bid + premium), fee added after tax.
        // ENC: tax on (bid + premium + fee).
        return src === "AMZ"
          ? bid * 1.16 * 1.13 + fee
          : (bid * 1.16 + fee) * 1.13;
      }
      // Work out the fee that was used, from the saved total
      function inferFee(item) {
        const src = item.source || "ENC";
        const f =
          src === "AMZ"
            ? item.totalPaid - item.bid * 1.16 * 1.13
            : item.totalPaid / 1.13 - item.bid * 1.16;
        if (!isFinite(f) || f < 0 || f > 50) return src === "AMZ" ? 1 : 1.5;
        return Math.round(f * 100) / 100;
      }

      function openEdit(id) {
        const i = db.find((x) => x.id === id);
        if (!i) return;
        edId = id;
        edSrc = i.source || "ENC";
        edCostTouched = false;
        document.getElementById("ed-name").value = i.name;
        document.getElementById("ed-bid").value = i.bid;
        document.getElementById("ed-fee").value = inferFee(i).toFixed(2);
        document.getElementById("ed-date").value = i.date || "";
        document.getElementById("ed-sold-box").classList.toggle("hidden", !i.sold);
        document.getElementById("ed-sell").value = i.sold ? i.sell : "";
        document.getElementById("ed-sold-date").value = i.soldDate || "";
        setEditSrc(edSrc, true);
        document.getElementById("edit-modal").classList.remove("hidden");
      }
      function closeEdit() {
        document.getElementById("edit-modal").classList.add("hidden");
        edId = null;
      }
      function setEditSrc(src, initial) {
        if (!initial && src !== edSrc) {
          // Switching source: use that source's standard fee
          document.getElementById("ed-fee").value = (src === "AMZ" ? 1 : 1.5).toFixed(2);
          edCostTouched = true;
        }
        edSrc = src;
        document.getElementById("ed-btn-enc").classList.toggle("active", src === "ENC");
        document.getElementById("ed-btn-amz").classList.toggle("active", src === "AMZ");
        editSummary();
      }
      function editCostChanged() {
        edCostTouched = true;
        editSummary();
      }
      function editPaid() {
        const i = db.find((x) => x.id === edId);
        if (!edCostTouched) return i.totalPaid;
        const b = parseFloat(document.getElementById("ed-bid").value) || 0;
        const f = parseFloat(document.getElementById("ed-fee").value) || 0;
        return costFor(b, f, edSrc);
      }
      function editSummary() {
        const i = db.find((x) => x.id === edId);
        if (!i) return;
        const paid = editPaid();
        const el = document.getElementById("ed-summary");
        if (!i.sold) {
          el.innerHTML = `Paid <b class="text-slate-800">$${paid.toFixed(2)}</b>`;
          return;
        }
        const sell = parseFloat(document.getElementById("ed-sell").value) || 0;
        const profit = sell - paid;
        const roi = paid > 0 ? (profit / paid) * 100 : 0;
        el.innerHTML = `Paid <b class="text-slate-800">$${paid.toFixed(2)}</b> · Profit <b class="${
          roi >= 100 ? "high-roi" : profit >= 0 ? "text-green-600" : "text-red-600"
        }">$${profit.toFixed(2)} (${roi.toFixed(0)}%)</b>`;
      }
      function saveEdit() {
        const i = db.find((x) => x.id === edId);
        if (!i) return closeEdit();
        const name = document.getElementById("ed-name").value.trim();
        const bid = parseFloat(document.getElementById("ed-bid").value);
        if (!name || isNaN(bid)) {
          alert("Name and bid are required.");
          return;
        }
        const paid = editPaid();
        i.name = name;
        i.bid = bid;
        i.source = edSrc;
        i.totalPaid = paid;
        i.date = document.getElementById("ed-date").value || i.date;
        if (i.sold) {
          const sell = parseFloat(document.getElementById("ed-sell").value);
          if (!isNaN(sell)) i.sell = sell;
          i.profit = i.sell - paid;
          const sd = document.getElementById("ed-sold-date").value;
          if (sd) i.soldDate = sd;
          else delete i.soldDate;
        }
        save();
        closeEdit();
      }
      // Older name for the same action
      function editName(id) {
        openEdit(id);
      }

      function render() {
        if (curTab === "calculator") return;
        const list = document.getElementById("item-list");
        const trList = document.getElementById("trash-list");
        list.innerHTML = "";
        trList.innerHTML = "";
        let pTot = 0,
          cTot = 0,
          revTot = 0, // total sale price of all sold items
          unsoldTot = 0; // cost of items on the Inv tab (unsold, not archived)
        db.forEach((i) => {
          if (i.sold) {
            pTot += i.profit;
            revTot += i.sell;
          } else if (!i.archived) {
            unsoldTot += i.totalPaid;
          }
          cTot += i.totalPaid;
        });

        const filtered = db
          .filter((i) => {
            if (curTab === "inventory")
              return (
                !i.sold &&
                !i.archived &&
                (!staleOnly ||
                  daysBetween(i.date, localToday()) >= STALE_DAYS)
              );
            if (curTab === "sold") return i.sold;
            if (curTab === "archive") return i.archived;
            return false;
          })
          .filter((i) =>
            i.name
              .toLowerCase()
              .includes(
                document.getElementById("search-input").value.toLowerCase(),
              ),
          );

        renderTabExtra();

        const groups = filtered.reduce((acc, i) => {
          const key = `${i.date || "N/A"}_${i.source || "ENC"}`;
          if (!acc[key]) acc[key] = [];
          acc[key].push(i);
          return acc;
        }, {});

        Object.keys(groups)
          .sort((a, b) => b.localeCompare(a))
          .forEach((key) => {
            const [date, source] = key.split("_");
            const batch = db.filter(
              (d) => d.date === date && d.source === source,
            );
            let bCost = 0,
              bProf = 0,
              bSold = 0;
            batch.forEach((i) => {
              bCost += i.totalPaid;
              if (i.sold) {
                bProf += i.profit;
                bSold += i.sell;
              }
            });
            const be = Math.max(0, bCost - bSold);
            const roi = bCost > 0 ? ((bProf / bCost) * 100).toFixed(0) : 0;

            const head = document.createElement("div");
            head.className = "flex flex-col items-center mb-2 mt-4 px-1";
            head.innerHTML = `
                    <span class="bg-slate-800 text-white text-[8px] font-black px-3 py-1 rounded-full uppercase mb-1">${date}</span>
                    <div class="flex flex-wrap justify-center gap-x-3 gap-y-1 text-[8px] font-bold text-slate-400 uppercase tracking-tight">
                        <span><b class="text-blue-600">${source}</b></span>
                        <span>Cost: <b class="text-slate-800">$${bCost.toFixed(
                          2,
                        )}</b></span>
                        <span>Profit: <b class="${
                          bProf >= 0 ? "text-green-600" : "text-red-600"
                        }">$${bProf.toFixed(2)}</b></span>
                        <span>ROI: <b>${roi}%</b></span>
                        <span>BE: <b class="text-slate-800">$${be.toFixed(
                          2,
                        )}</b></span>
                    </div>`;
            list.appendChild(head);

            groups[key]
              .sort((a, b) => a.name.localeCompare(b.name))
              .forEach((item) => {
                const row = document.createElement("div");
                row.className =
                  curTab === "inventory"
                    ? "swipe-container swipeable"
                    : "swipe-container";
                const itemRoi =
                  item.totalPaid > 0
                    ? ((item.profit / item.totalPaid) * 100).toFixed(0)
                    : 0;
                const isHigh = item.sold && item.profit / item.totalPaid >= 1;
                const age = daysBetween(item.date, localToday());
                const ageBadge =
                  curTab === "inventory" && age >= STALE_DAYS
                    ? `<span class="ml-1 px-1.5 py-0.5 rounded-full text-[7px] font-black align-middle ${
                        age >= OLD_DAYS
                          ? "bg-red-100 text-red-600"
                          : "bg-amber-100 text-amber-700"
                      }">${age}d</span>`
                    : "";
                const held = item.soldDate
                  ? daysBetween(item.date, item.soldDate)
                  : null;
                const soldInfo =
                  item.sold && !item.soldDate
                    ? `<p class="text-[7px] font-bold text-amber-600 uppercase mt-0.5" onclick="openEdit(${item.id})">No sale date · tap name to add</p>`
                    : item.sold && item.soldDate
                    ? `<p class="text-[7px] font-bold text-slate-400 uppercase mt-0.5">Sold ${fmtDay(
                        item.soldDate,
                      )}${
                        held !== null && held >= 0
                          ? ` · ${held} day${held === 1 ? "" : "s"} to sell`
                          : ""
                      }</p>`
                    : "";
                const action =
                  curTab === "inventory"
                    ? `<div class="swipe-actions"><button onclick="toggleArch(${item.id})" class="flex-1 bg-amber-500 text-white font-black text-[8px] uppercase">Arch</button><button onclick="toTrash(${item.id})" class="flex-1 bg-red-600 text-white font-black text-[8px] uppercase">Del</button></div>`
                    : "";

                row.innerHTML = `${action}
                        <div id="row-${
                          item.id
                        }" class="swipe-content p-3 border border-slate-200 rounded-xl flex justify-between items-center ${
                          item.sold || item.archived
                            ? "bg-slate-50 opacity-80"
                            : "shadow-sm"
                        }">
                            <div class="flex-1 pr-3 overflow-hidden">
                                <p class="item-name text-slate-800" onclick="openEdit(${
                                  item.id
                                })">${item.name}${ageBadge}</p>
                                <p class="text-[7px] font-bold text-slate-400 uppercase mt-0.5">Bid: $${item.bid.toFixed(
                                  2,
                                )} | Paid: $${item.totalPaid.toFixed(2)} ${
                                  item.sold
                                    ? `<span class="text-blue-600"> | Sold: $${item.sell.toFixed(
                                        2,
                                      )}</span>`
                                    : ""
                                }</p>${soldInfo}
                            </div>
                            <div class="text-right shrink-0">
                                ${
                                  item.sold
                                    ? `<button onclick="sell(${
                                        item.id
                                      })" class="flex flex-col items-end">
                                    <p class="font-black text-xs ${
                                      isHigh
                                        ? "high-roi"
                                        : item.profit >= 0
                                          ? "text-green-600"
                                          : "text-red-600"
                                    }">$${item.profit.toFixed(2)}</p>
                                    <p class="text-[6px] font-black opacity-60 uppercase">${itemRoi}% ROI</p>
                                </button>`
                                    : item.archived
                                      ? `<button onclick="toggleArch(${item.id})" class="text-blue-600 font-black text-[8px] border px-2 py-1 rounded-lg">RESTORE</button>`
                                      : `<button onclick="sell(${item.id})" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg font-black text-[8px] uppercase">Sell</button>`
                                }
                            </div>
                        </div>`;
                list.appendChild(row);
              });
          });

        trash.forEach((i) => {
          const tr = document.createElement("div");
          tr.className =
            "p-2 border border-slate-200 rounded-lg bg-slate-100 flex justify-between items-center opacity-80";
          tr.innerHTML = `<div class="flex-1"><p class="font-bold text-slate-600 text-[10px] truncate">${
            i.name
          }</p>
                    <p class="text-[6px] font-bold text-slate-400 uppercase">Paid: $${i.totalPaid.toFixed(
                      2,
                    )} | ${i.date}</p></div>
                    <div class="flex gap-2"><button onclick="revive(${
                      i.id
                    })" class="text-blue-600 font-black text-[7px] border bg-white px-2 py-1 rounded-lg">RESTORE</button>
                    <button onclick="kill(${
                      i.id
                    })" class="text-red-500 font-black text-lg px-2">×</button></div>`;
          trList.appendChild(tr);
        });

        document.getElementById("total-profit").innerText = `$${pTot.toFixed(
          2,
        )}`;
        document.getElementById("total-cost").innerText = `$${cTot.toFixed(2)}`;
        document.getElementById("total-revenue").innerText =
          `$${revTot.toFixed(2)}`;
        document.getElementById("total-unsold").innerText =
          `$${unsoldTot.toFixed(2)}`;
        document.getElementById("trash-count").innerText = trash.length;
      }

      // Extra strip above the list: stale stock notice on Inv,
      // profit by month on Sold.
      function renderTabExtra() {
        const box = document.getElementById("tab-extra");
        box.innerHTML = "";
        const today = localToday();

        if (curTab === "inventory") {
          const stale = db.filter(
            (i) =>
              !i.sold &&
              !i.archived &&
              daysBetween(i.date, today) >= STALE_DAYS,
          );
          if (!stale.length && !staleOnly) return;
          const old = stale.filter(
            (i) => daysBetween(i.date, today) >= OLD_DAYS,
          ).length;
          const cost = stale.reduce((t, i) => t + i.totalPaid, 0);
          box.innerHTML = `
            <button onclick="toggleStale()" class="w-full flex items-center justify-between gap-2 mb-1 px-3 py-2 rounded-xl border text-left ${
              staleOnly
                ? "bg-amber-500 border-amber-500 text-white"
                : "bg-amber-50 border-amber-200 text-amber-800"
            }">
              <span class="text-[9px] font-black uppercase tracking-tight">
                ${stale.length} item${stale.length === 1 ? "" : "s"} unsold ${STALE_DAYS}+ days
                <span class="font-bold opacity-80">· $${cost.toFixed(2)}${
                  old ? ` · ${old} over ${OLD_DAYS}d` : ""
                }</span>
              </span>
              <span class="text-[8px] font-black uppercase shrink-0">${
                staleOnly ? "Show all" : "Show"
              }</span>
            </button>`;
          return;
        }

        if (curTab === "sold") {
          const months = {};
          let undated = 0;
          db.filter((i) => i.sold).forEach((i) => {
            if (!i.soldDate) return undated++;
            const k = i.soldDate.slice(0, 7);
            const m = (months[k] = months[k] || {
              profit: 0,
              rev: 0,
              n: 0,
              days: 0,
              dn: 0,
            });
            m.profit += i.profit;
            m.rev += i.sell;
            m.n++;
            const d = daysBetween(i.date, i.soldDate);
            if (d !== null && d >= 0) {
              m.days += d;
              m.dn++;
            }
          });
          const keys = Object.keys(months).sort().reverse();
          if (!keys.length && !undated) return;
          const rows = keys
            .map((k) => {
              const m = months[k];
              return `<div class="flex items-center justify-between py-1.5 border-t border-slate-100 first:border-0">
                <span class="text-[10px] font-black text-slate-700 w-16">${fmtMonth(k)}</span>
                <span class="text-[8px] font-bold text-slate-400 uppercase flex-1">${m.n} sold${
                  m.dn ? ` · avg ${Math.round(m.days / m.dn)} days` : ""
                } · Rev $${m.rev.toFixed(0)}</span>
                <span class="text-[11px] font-black ${
                  m.profit >= 0 ? "text-green-600" : "text-red-600"
                }">$${m.profit.toFixed(2)}</span>
              </div>`;
            })
            .join("");
          box.innerHTML = `
            <div class="mb-1 px-3 py-2 rounded-xl border border-slate-200 bg-white shadow-sm">
              <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Profit by month sold</p>
              ${rows}
              ${
                undated
                  ? `<p class="text-[7px] font-bold text-slate-400 uppercase pt-1.5 ${keys.length ? "border-t border-slate-100" : ""}">${undated} older sale${undated === 1 ? "" : "s"} with no date · tap the name to add</p>`
                  : ""
              }
            </div>`;
        }
      }

      // ---- Swipe to reveal Arch / Del ----
      // Works like most phone apps: the row follows your finger, the
      // gesture locks to sideways or up/down after the first few pixels,
      // and on release the row snaps open or closed. Only one row is open
      // at a time, and scrolling closes it.
      const SWIPE_W = 110; // width of the Arch/Del buttons
      let sw = null; // current gesture
      let swipeJustEnded = 0;

      function closeRow(r) {
        if (!r || !r.classList.contains("swiped")) return;
        r.classList.remove("dragging");
        r.style.transform = "";
        r.classList.remove("swiped");
        // Hide the buttons once the slide-back animation finishes
        setTimeout(() => {
          if (!r.classList.contains("swiped") && !r.style.transform)
            r.parentElement.classList.remove("open");
        }, 200);
      }
      function closeAllRows(except) {
        document
          .querySelectorAll(".swipe-content.swiped")
          .forEach((r) => r !== except && closeRow(r));
      }

      document.addEventListener(
        "touchstart",
        (e) => {
          const row = e.target.closest(".swipeable .swipe-content");
          // Touching anywhere else closes an open row
          if (!row) {
            if (!e.target.closest(".swipe-actions")) closeAllRows();
            sw = null;
            return;
          }
          const t = e.touches[0];
          sw = {
            row,
            x: t.clientX,
            y: t.clientY,
            base: row.classList.contains("swiped") ? -SWIPE_W : 0,
            dir: null, // "h" or "v" once decided
            dx: 0,
            t: Date.now(),
          };
        },
        { passive: true },
      );

      document.addEventListener(
        "touchmove",
        (e) => {
          if (!sw) return;
          const t = e.touches[0];
          const dx = t.clientX - sw.x;
          const dy = t.clientY - sw.y;
          if (!sw.dir) {
            if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // not sure yet
            // Lock direction: anything more sideways than vertical is a swipe
            sw.dir = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
            if (sw.dir === "h") {
              closeAllRows(sw.row);
              sw.row.classList.add("dragging");
              sw.row.parentElement.classList.add("open");
            }
          }
          if (sw.dir !== "h") return;
          e.preventDefault(); // keep the page still while swiping
          sw.dx = dx;
          let x = sw.base + dx;
          // Resist dragging past fully open or past closed
          if (x < -SWIPE_W) x = -SWIPE_W + (x + SWIPE_W) * 0.3;
          if (x > 0) x = x * 0.3;
          sw.row.style.transform = `translateX(${x}px)`;
        },
        { passive: false },
      );

      function endSwipe() {
        if (!sw) return;
        const g = sw;
        sw = null;
        if (g.dir !== "h") return;
        swipeJustEnded = Date.now();
        const r = g.row;
        r.classList.remove("dragging");
        r.style.transform = "";
        const pos = g.base + g.dx;
        // A quick flick opens/closes even if it didn't travel halfway
        const fast =
          Math.abs(g.dx) > 25 &&
          Math.abs(g.dx) / Math.max(Date.now() - g.t, 1) > 0.25;
        const open = fast ? g.dx < 0 : pos < -SWIPE_W / 2;
        if (open) {
          r.classList.add("swiped");
        } else {
          r.classList.add("swiped"); // so closeRow animates it back
          closeRow(r);
        }
      }
      document.addEventListener("touchend", endSwipe, { passive: true });
      document.addEventListener("touchcancel", endSwipe, { passive: true });

      // A swipe shouldn't also count as a tap (e.g. opening the name editor)
      document.addEventListener(
        "click",
        (e) => {
          if (Date.now() - swipeJustEnded < 350) {
            e.stopPropagation();
            e.preventDefault();
          }
        },
        true,
      );

      // Scrolling closes any open row
      window.addEventListener("scroll", () => closeAllRows(), {
        passive: true,
      });

      function toggleArch(id) {
        const i = db.find((x) => x.id === id);
        if (i) i.archived = !i.archived;
        save();
      }
      function toTrash(id) {
        const i = db.find((x) => x.id === id);
        if (i) {
          trash.push(i);
          db = db.filter((x) => x.id !== id);
          save();
        }
      }
      function revive(id) {
        const i = trash.find((x) => x.id === id);
        if (i) {
          db.push(i);
          trash = trash.filter((x) => x.id !== id);
          save();
        }
      }
      function kill(id) {
        if (confirm("Permanently delete this item?")) {
          trash = trash.filter((x) => x.id !== id);
          save();
        }
      }
      function emptyTrash() {
        if (confirm("PERMANENTLY WIPE EVERYTHING in the trash?")) {
          trash = [];
          save();
        }
      }
      function toggleTrash() {
        document.getElementById("trash-list").classList.toggle("hidden");
      }

      function sell(id) {
        actId = id;
        const i = db.find((x) => x.id === id);
        document.getElementById("sale-modal").classList.remove("hidden");
        document.getElementById("sale-price").value = i.sold ? i.sell : "";
        document.getElementById("sale-date").value =
          (i.sold && i.soldDate) || localToday();
        document
          .getElementById("unsold-opt")
          .classList.toggle("hidden", !i.sold);
        setTimeout(() => document.getElementById("sale-price").focus(), 150);
      }
      function confirmSale() {
        const v = parseFloat(document.getElementById("sale-price").value);
        const i = db.find((x) => x.id === actId);
        if (i && !isNaN(v)) {
          i.sell = v;
          i.profit = v - i.totalPaid;
          i.sold = true;
          i.soldDate =
            document.getElementById("sale-date").value || localToday();
          save();
        }
        closeSale();
      }
      function markUnsold() {
        const i = db.find((x) => x.id === actId);
        if (i) {
          i.sold = false;
          i.sell = 0;
          i.profit = 0;
          delete i.soldDate;
          save();
        }
        closeSale();
      }
      function closeSale() {
        document.getElementById("sale-modal").classList.add("hidden");
      }

      function updateLiveProfit() {
        const val = parseFloat(document.getElementById("sale-price").value);
        const item = db.find((x) => x.id === actId);
        const box = document.getElementById("live-profit-box");
        const display = document.getElementById("live-profit-val");

        // If the user hasn't typed anything yet or cleared the input, don't show the box
        if (isNaN(val) || !item) {
          box.classList.add("hidden");
          return;
        }

        // Calculate against totalPaid directly (works for new items and edits alike)
        const calculatedProfit = val - item.totalPaid;
        const roi =
          item.totalPaid > 0
            ? ((calculatedProfit / item.totalPaid) * 100).toFixed(0)
            : 0;

        // Same colours as the Sold tab: dark green for 100%+ ROI,
        // green for any profit, red for a loss.
        const isHigh = calculatedProfit / item.totalPaid >= 1;
        display.className = `text-xs font-black ${
          isHigh
            ? "high-roi"
            : calculatedProfit >= 0
              ? "text-green-600"
              : "text-red-600"
        }`;

        display.innerText = `$${calculatedProfit.toFixed(2)} (${roi}% ROI)`;
        box.classList.remove("hidden");
      }

      function addItem() {
        const n = document.getElementById("in-name").value;
        const b = parseFloat(document.getElementById("in-buy").value);
        if (!n || isNaN(b)) return;
        const f = parseFloat(document.getElementById("in-fee").value || 1.5);
        const date = document.getElementById("in-date").value;
        const isAmz = document
          .getElementById("btn-amz")
          .classList.contains("active");

        // Calculate Total Paid based on Source
        // AMZ: Tax (13%) is only on (Bid * Premium). Fee is added after tax.
        // ENC: Tax (13%) is on the entire sum (Bid * Premium + Fee).
        const bidWithPrem = b * 1.16;
        const tot = isAmz ? bidWithPrem * 1.13 + f : (bidWithPrem + f) * 1.13;

        db.push({
          id: Date.now(),
          name: n,
          date: date,
          bid: b,
          totalPaid: tot,
          sell: 0,
          profit: 0,
          sold: false,
          archived: false,
          source: isAmz ? "AMZ" : "ENC",
        });

        document.getElementById("in-name").value = "";
        document.getElementById("in-buy").value = "";
        save();
        toggleAddModal();
      }

      function exportBackup() {
        const now = new Date();
        const ts =
          localToday() +
          "_" +
          now.getHours().toString().padStart(2, "0") +
          now.getMinutes().toString().padStart(2, "0");
        const blob = new Blob([JSON.stringify({ db, trash })], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `BidLedger_backup_${ts}.json`;
        a.click();
      }
      function handleRestore(input) {
        if (!input.files[0]) return;

        // Add the confirmation check here
        const confirmOverwrite = confirm(
          "This will DELETE all current items and replace them with the backup file. Are you sure?",
        );

        if (confirmOverwrite) {
          const r = new FileReader();
          r.onload = (e) => {
            try {
              const b = JSON.parse(e.target.result);
              // Only overwrite if the file structure looks correct
              db = b.db || [];
              trash = b.trash || [];
              save();
              alert("Restore successful!");
            } catch (err) {
              alert("Error: Invalid backup file format.");
            }
          };
          r.readAsText(input.files[0]);
        } else {
          // Clear the input so the same file can be selected again later
          input.value = "";
        }
      }

      function openImportModal(input) {
        if (input.files[0]) {
          csvFile = input.files[0];
          const fileName = csvFile.name;
          document.getElementById("import-filename").innerText = fileName;

          // 1. Detect Source (AMZ vs ENC)
          if (fileName.toUpperCase().includes("AMZ")) {
            setImpSrc("AMZ");
          } else if (fileName.toUpperCase().includes("ENC")) {
            setImpSrc("ENC");
          } else {
            setImpSrc("ENC"); // Default
          }

          // 2. Detect Date (Pattern: Mon-DD-YY, e.g., Mar-01-26)
          const dateMatch = fileName.match(
            /(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)-(\d{1,2})-(\d{2})/i,
          );

          if (dateMatch) {
            const months = {
              jan: "01",
              feb: "02",
              mar: "03",
              apr: "04",
              may: "05",
              jun: "06",
              jul: "07",
              aug: "08",
              sep: "09",
              oct: "10",
              nov: "11",
              dec: "12",
            };
            const month = months[dateMatch[1].toLowerCase()];
            const day = dateMatch[2].padStart(2, "0");
            const year = "20" + dateMatch[3]; // Assumes 20xx century
            document.getElementById("imp-date").value =
              `${year}-${month}-${day}`;
          } else {
            // Default to current date if no pattern found
            document.getElementById("imp-date").value = localToday();
          }

          document.getElementById("import-modal").classList.remove("hidden");
        }
      }
      function closeImport() {
        document.getElementById("import-modal").classList.add("hidden");
      }
      function setImpSrc(s) {
        impSrc = s;
        document
          .getElementById("imp-enc")
          .classList.toggle("active", s === "ENC");
        document
          .getElementById("imp-amz")
          .classList.toggle("active", s === "AMZ");
      }
      function confirmImport() {
        const dt = document.getElementById("imp-date").value;
        const r = new FileReader();
        const fee = impSrc === "ENC" ? 1.5 : 1.0;
        r.onload = (e) => {
          e.target.result
            .split("\n")
            .slice(1)
            .forEach((row) => {
              const c = row.split(",");
              if (c.length > 1) {
                const b = parseFloat(c[1]) || 0;
                const bidWithPrem = b * 1.16;
                const tot =
                  impSrc === "AMZ"
                    ? bidWithPrem * 1.13 + fee // Tax doesn't touch the fee
                    : (bidWithPrem + fee) * 1.13; // ENC style (everything taxed)
                db.push({
                  id: Date.now() + Math.random(),
                  date: dt,
                  name: c[0].replace(/"/g, "").trim(),
                  bid: b,
                  totalPaid: tot,
                  sell: 0,
                  profit: 0,
                  sold: false,
                  archived: false,
                  source: impSrc,
                });
              }
            });
          save();
          closeImport();
        };
        r.readAsText(csvFile);
      }

      function toggleAddModal() {
        document.getElementById("add-modal").classList.toggle("hidden");
      }
      function setQuickFee(v, t) {
        document.getElementById("in-fee").value = v.toFixed(2);
        document
          .getElementById("btn-enc")
          .classList.toggle("active", t === "ENC");
        document
          .getElementById("btn-amz")
          .classList.toggle("active", t === "AMZ");
      }

      render();

      // Offline support: cache the app so it opens without a connection
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("sw.js").catch(() => {}),
        );
      }
    </script>
  </body>
</html>
