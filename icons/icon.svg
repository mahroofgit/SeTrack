<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172554"/><stop offset=".55" stop-color="#0b1222"/><stop offset="1" stop-color="#020617"/></linearGradient>
  <radialGradient id="glow" cx=".3" cy=".25" r=".6"><stop offset="0" stop-color="#3b82f6" stop-opacity=".35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
  <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#172554"/></linearGradient>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
  <linearGradient id="profit" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset=".35" stop-color="#fbbf24"/><stop offset=".75" stop-color="#d97706"/><stop offset="1" stop-color="#92400e"/></linearGradient>
  <linearGradient id="goldInner" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fde68a"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#92400e"/><stop offset=".5" stop-color="#b45309"/><stop offset="1" stop-color="#78350f"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>

<rect width="512" height="512" fill="url(#bg)"/>
<rect width="512" height="512" fill="url(#glow)"/>

<!-- Ledger -->
<g filter="url(#shadow)">
  <rect x="104" y="86" width="254" height="324" rx="26" fill="url(#cover)"/>
  <!-- page thickness -->
  <rect x="140" y="108" width="208" height="290" rx="12" fill="#cbd5e1"/>
  <rect x="136" y="104" width="208" height="290" rx="12" fill="#e2e8f0"/>
  <rect x="130" y="98" width="208" height="290" rx="12" fill="url(#page)"/>
  <!-- spine -->
  <rect x="104" y="86" width="40" height="324" rx="14" fill="url(#spine)"/>
  <rect x="104" y="126" width="40" height="8" fill="#fbbf24" opacity=".9"/>
  <rect x="104" y="362" width="40" height="8" fill="#fbbf24" opacity=".9"/>
</g>
<!-- ledger rules + margin -->
<g stroke="#e2e8f0" stroke-width="6" stroke-linecap="round">
  <path d="M166 150h152"/><path d="M166 190h152"/><path d="M166 230h152"/><path d="M166 270h152"/><path d="M166 310h152"/><path d="M166 350h152"/>
</g>
<path d="M162 118V372" stroke="#fca5a5" stroke-width="4"/>

<!-- Profit line with glow -->
<polyline points="160,314 204,262 238,284 296,198" fill="none" stroke="#22c55e" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity=".35" filter="url(#soft)"/>
<polyline points="160,314 204,262 238,284 288,210" fill="none" stroke="url(#profit)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M308 180 L307 222 L270 198 Z" fill="#4ade80" stroke="#4ade80" stroke-width="8" stroke-linejoin="round"/>
<g fill="#ffffff" stroke="#16a34a" stroke-width="6"><circle cx="204" cy="262" r="9"/><circle cx="238" cy="284" r="9"/></g>

<!-- Gold coin -->
<g filter="url(#shadow)">
  <circle cx="380" cy="120" r="66" fill="#0b1222"/>
  <circle cx="380" cy="120" r="58" fill="url(#gold)"/>
  <circle cx="380" cy="120" r="45" fill="url(#goldInner)"/>
  <circle cx="380" cy="120" r="45" fill="none" stroke="#fef3c7" stroke-opacity=".55" stroke-width="3"/>
  <text x="380" y="146" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="74" fill="#78350f" text-anchor="middle">$</text>
  <path d="M342 98 A44 44 0 0 1 372 74" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- Gavel -->
<g filter="url(#shadow)" transform="translate(372 356) rotate(-45) scale(.86)">
  <g stroke="#0b1222" stroke-width="9" paint-order="stroke">
    <rect x="-12" y="4" width="24" height="134" rx="12" fill="url(#wood)"/>
    <rect x="-64" y="-58" width="128" height="68" rx="16" fill="url(#head)"/>
    <rect x="-78" y="-68" width="24" height="88" rx="10" fill="url(#gold)"/>
    <rect x="54" y="-68" width="24" height="88" rx="10" fill="url(#gold)"/>
  </g>
  <rect x="-50" y="-50" width="100" height="10" rx="5" fill="#fff" opacity=".8"/>
</g>
</svg>
